services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tinyplace
      POSTGRES_PASSWORD: tinyplace
      POSTGRES_DB: tinyplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinyplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tinyplace
      MINIO_ROOT_PASSWORD: tinyplace-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://tinyplace:tinyplace@postgres:5432/tinyplace
      REDIS_URL: redis://redis:6379
      PORT: 8080
      MIDNIGHT_NETWORK: local
      SETTLEMENT_NETWORK: midnight
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/data:/app/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
